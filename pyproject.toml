[project]
name = "nano-standup"
version = "0.1.0"
description = "Weekly briefs for CF nano instrument guarantors."
requires-python = ">=3.12"
dependencies = []

[project.scripts]
nano-standup = "nano_standup.cli:main"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.mypy]
strict = true
files = ["src", "tests"]
mypy_path = "tests"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
]
