[project]
name = "nano-standup"
version = "0.1.0"
description = "Weekly briefs for CF nano instrument guarantors."
requires-python = ">=3.12"
dependencies = []

[project.scripts]
nano-standup = "nano_standup.cli:main"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.mypy]
strict = true
files = ["src", "tests"]
mypy_path = "tests"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.ruff]
# The code is written wider than the default 88; 120 fits it without a full reformat.
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# Pyflakes, pycodestyle, import order, bugbear, pyupgrade, simplify.
select = ["F", "E", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
# Shared test modules in tests/; keep them in their own group after the project imports.
known-local-folder = ["fake_booking_api", "helpers", "local_booking_server"]
